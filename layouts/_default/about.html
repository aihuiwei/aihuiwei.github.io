{{ define "main" }}
<div class="wrap page">
  <p class="kicker about-kicker">Beyond economics</p>
  <h1 class="page-title">About</h1>
  <div class="prose about-text">
    <p>Outside of research, I enjoy photography and finding beauty in everyday life.</p>
  </div>
  <div class="gallery">
    {{ range $i, $p := site.Data.photos }}
      {{ $r := div (float $p.w) $p.h }}
      <figure style="--r: {{ $r }}"{{ if $p.wide }} class="wide"{{ end }}>
        <a href="{{ printf "/img/photos/%s.jpg" $p.file | relURL }}" data-index="{{ $i }}" data-caption="{{ $p.caption }}">
          <img src="{{ printf (cond (default false $p.wide) "/img/photos/%s.jpg" "/img/photos/%s-sm.jpg") $p.file | relURL }}" alt="{{ $p.caption }}" width="{{ $p.w }}" height="{{ $p.h }}" loading="{{ if lt $i 3 }}eager{{ else }}lazy{{ end }}" decoding="async">
        </a>
        <figcaption>{{ $p.caption }}</figcaption>
      </figure>
    {{ end }}
  </div>
</div>
<dialog class="lightbox" aria-label="Photo viewer">
  <button class="lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-next" type="button" aria-label="Next photo">&#8250;</button>
</dialog>
<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.gallery a'));
  var box = document.querySelector('.lightbox');
  if (!box || !box.showModal) return;
  var img = box.querySelector('img'), cap = box.querySelector('figcaption'), cur = 0, x0 = null;
  function show(i) {
    cur = (i + links.length) % links.length;
    img.src = links[cur].href; img.alt = links[cur].dataset.caption; cap.textContent = links[cur].dataset.caption;
  }
  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(i); box.showModal(); });
  });
  box.querySelector('.lb-close').onclick = function () { box.close(); };
  box.querySelector('.lb-prev').onclick = function () { show(cur - 1); };
  box.querySelector('.lb-next').onclick = function () { show(cur + 1); };
  box.addEventListener('click', function (e) { if (e.target === box) box.close(); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
  box.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });
})();
</script>
{{ end }}
